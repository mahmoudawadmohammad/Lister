<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Reduce The Odds For A Lacuna XSS -->
		<meta http-equiv="Content-Type" content="text/html; charset= ISO-8859-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "keywords" content="">
    <meta name="description" content="">
    <title>Password Verification Page</title>
    <link rel="icon" href="../Icons/Verify_1.ico">
            <!-- Link Font Awesome -->
		<link rel="stylesheet" href="../Css/all.min.css">
            <!-- Render All Element Nornmally -->
		<link rel="stylesheet" href="../Css/Normalize.css">
            <!-- Link BootStrap File Css -->
		<link rel="stylesheet" href="../Css/Style_Bootstrap.css">
            <!-- Link Subscribe File Css -->
		<link rel="stylesheet" href="../Css/Common_For_All.css">
            <!-- Link Common File Css -->
    <link rel="stylesheet" href="../Css/Restaurant_Login_Page.css">
    <link rel="stylesheet" href="" id="linkArabic">
            <!-- Link Main File Css -->
		<link rel="stylesheet" href="../Css/Password_Verification_Page.css">
  </head>
  <body>
    <div class="languages">
      <button id="english" class="btn-secondary btn-lg" title="Choose English Language (Shift + E)">English</button>
      <button id="arabic" class="btn-info btn-lg" title="Choose Arabic Language (Shift + A)">عربي</button>
    </div>
    <button id="GetInfo" data-bs-toggle="modal" data-bs-target="#PasswordEdit"></button>
    <div class="containers">
      <h2>Enter The Code</h2>
      <p>Please Enter your The Code You Received ,<br> and we'll Take you To Page For Change Your Password</p>
      <div class="code-container">
        <input type="number" class="code" id="code1" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
        <input type="number" class="code" id="code2" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
        <input type="number" class="code" id="code3" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
        <input type="number" class="code" id="code4" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
        <input type="number" class="code" id="code5" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
        <input type="number" class="code" id="code6" placeholder="0" min="0" max="9" onkeypress="playtypingAudio();" required>
      </div>
      <small id="message-codeString"></small>
      <div>
        <button class="btn btn-primary" id="btn_verify" onclick="playBtnAudio();">Verfiy</button>
      </div>
      <small id="receive">I don't receive a code</small>
      <strong>RESEND</strong>
    </div>
    <!-- Window Edit Password Start -->
		<div class="modal fade passwordEdit" id="PasswordEdit">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="staticBackdropLabel">Change Password</h4>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form action="" method="post" id="form-changepassword">
						<div class="input-div one">
							<div>
								<h5>New Password</h5>
								<input type="password" id="NewPassword" name="NewPassword" autocomplete="off" 
								spellcheck="false" dir="auto" placeholder="Enter The Name Password" 
                minlength="8" onkeypress="playtypingAudio();">
								<div class="i">
									<i class="fa-solid fa-lock" title="Password Icon"></i>
								</div>
									<div class="check">
											<i class="fas fa-check-circle"></i>
											<i class="fas fa-exclamation-circle"></i> 
									</div>
                  <div class="show" title="Show Password">
                        <i class="fa-solid fa-eye-slash" id="showiconPassword"></i>
                    </div>
									<small id="message-NewPassword"></small>
							</div>
						</div>
						<div class="input-div two">
							<div>
								<h5>Confirm The New Password</h5>
								<input type="password" id="ConfirmNewPassword" name="ConfirmNewPassword" autocomplete="off" 
								spellcheck="false" dir="auto" placeholder="Enter Confirm The Name Password"
                minlength="8" onkeypress="playtypingAudio();">
								<div class="i">
									<i class="fa-solid fa-square-check" title="Confirm New Password Icon"></i>
								</div>
									<div class="check">
											<i class="fas fa-check-circle"></i>
											<i class="fas fa-exclamation-circle"></i> 
									</div>
                  <div class="show" title="Show Password">
                        <i class="fa-solid fa-eye-slash" id="showiconPasswordConfirm"></i>
                    </div>
									<small id="message-ConfirmNewPassword"></small>
							</div>
						</div>
          <div class="modal-footer">
						<div class="modal_create">
              <input type="submit" value="Change" class="btn_create" onclick="playBtnAudio();">
              <div class="i">
								<i class="fa-solid fa-pencil" title="Icon Edit"></i>
              </div>
            </div>
            </form>
						<button data-bs-dismiss="modal" class="btn_close" onclick="playBtnAudio();">Close</button>
          </div>
        </div>
      </div>
    </div>
		<!-- Window Edit Password End -->
		<!-- ----------------------- -->
    <!-- Loader Start -->
		<!-- <div class="loader-container">
			<img src="../loaders/Forget_Password_Page/2.gif" alt="">
		</div> -->
		<!-- Loader End -->
		<!-- ----------------------- -->
    <script src="../Js/js_Bootstrap.js"></script>
    <script src="../Js/Password_Verification_Page.js"></script>
    <script src="../Js/Audios.js"></script>
  </body>
</html>
