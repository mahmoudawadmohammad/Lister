<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Reduce The Odds For A Lacuna XSS -->
		<meta http-equiv="Content-Type" content="text/html; charset= ISO-8859-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "keywords" content="">
    <meta name="description" content="">
    <title>Forgot Your Password ?</title>
    <link rel="icon" href="../Icons/forgot_password.ico">
            <!-- Link Font Awesome -->
		<link rel="stylesheet" href="../Css/all.min.css">
            <!-- Render All Element Nornmally -->
		<link rel="stylesheet" href="../Css/Normalize.css">
            <!-- Link BootStrap File Css -->
		<link rel="stylesheet" href="../Css/Style_Bootstrap.css">
            <!-- Link Subscribe File Css -->
		<link rel="stylesheet" href="../Css/Common_For_All.css">
            <!-- Link Common File Css -->
    <link rel="stylesheet" href="../Css/Restaurant_Login_Page.css">
    <link rel="stylesheet" href="" id="linkArabic">
            <!-- Link Main File Css -->
		<link rel="stylesheet" href="../Css/forget_password.css">
  </head>
  <body>
    <div class="languages">
      <button id="english" class="btn-secondary btn-lg" title="Choose English Language (Shift + E)">English</button>
      <button id="arabic" class="btn-info btn-lg" title="Choose Arabic Language (Shift + A)">عربي</button>
    </div>
    <div class="container">
      <div class="login-container">
        <form action="" method="post">
          <img src="../images/Restaurant_Login_Page/Logo_User.png" alt="Avatar Image" class="avatar" title="Avatar Image">
          <h2>Forgot your password ?</h2>
          <h5>Please Enter your phone number, and we'll send you instructions to reset your password</h5>
          <div class="input-div one">
            <div class="i">
              <i class="fa-solid fa-phone-flip" title="Phone Number icon"></i>
            </div>
            <div>
              <h5>Phone Number</h5>
              <input type="text" name="PhoneNumber" id="PhoneNumber" dir="auto" class="input" 
              title="Phone Number (Alt + P)" minlength="10" maxlength="10" value="09" autocomplete="off" spellcheck="false"
              placeholder="09********" onkeypress="playtypingAudio();">
              <div class="check">
                <i class="fas fa-check-circle" title="Accept icon"></i>
                <i class="fas fa-exclamation-circle" title="Refusal icon"></i> 
              </div>
            </div>
          </div>
          <small id="messagePhoneNumber"></small>
          <div class="btn_send" title="Send (Alt + S)">
            <a href="">
              <input type="submit" value="Send" class="btn_submit" onclick="playBtnAudio();">
            </a>
            <div class="i">
              <i class="fa-solid fa-paper-plane" title="Send Icon"></i>
            </div>
          </div>
        </form>
      </div>
      <div class="img">
        <img src="../images/Restaurant_Login_Page/forget_password.svg" alt="Login Image" title="Login Image">
      </div>
    </div>
    <!-- Loader Start -->
		<div class="loader-container">
			<img src="../loaders/Forget_Password_Page/2.gif" alt="">
		</div>
		<!-- Loader End -->
		<!-- ----------------------- -->
    <script src="../Js/js_Bootstrap.js"></script>
    <script src="../Js/forget_password.js"></script>
    <script src="../Js/Audios.js"></script>
  </body>
</html>
